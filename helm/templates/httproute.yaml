{{- if .Values.hostNames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: external-http-gateway
      namespace: gateway
  hostnames:
    {{- range .Values.hostNames }}
    - "{{ . }}"
    {{- end }}
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
      - name: {{ .Release.Name }}
        port: {{ .Values.servicePort }}
{{- end }}
