name: Build & Deploy playground

# Prod only: push on main → k8s-03-prod.
# This repo is public, so it cannot use the private smartpricing/github-actions composite
# actions (GitHub blocks private actions from public repos): their steps are inlined here,
# with the same image naming, tag and helm release as the shared setup-env/build/deploy v2-wif.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-playground
  cancel-in-progress: false

# GCP auth uses Workload Identity Federation (no JSON key): needs id-token: write.
permissions:
  contents: read
  id-token: write

env:
  REGISTRY: europe-docker.pkg.dev/smartness-artifact-registry/docker
  NAMESPACE: ciaobooking
  GKE_CLUSTER: projects/smartness-prod/locations/europe-west1/clusters/k8s-03-prod
  WIF_PROVIDER: projects/150193600603/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: github-actions@smartness-cicd.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same as setup-env/v2: release name from imageName, TAG = <version>-<short sha>
      - name: Set image variables
        id: vars
        run: |
          SERVICE_NAME=$(jq -r '.imageName' package.json)
          TAG="$(jq -r '.version' package.json)-$(git rev-parse --short HEAD)"
          echo "SERVICE_NAME=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$REGISTRY/$SERVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.vars.outputs.IMAGE }}
          TAG: ${{ steps.vars.outputs.TAG }}
          DOCKER_BUILDKIT: "1"
        run: |
          gcloud auth configure-docker europe-docker.pkg.dev --quiet
          docker build . -f Dockerfile --platform linux/amd64 -t "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}

      # Chart.yaml is ephemeral (never committed), as in the shared deploy action
      - name: Deploy with Helm
        env:
          SERVICE_NAME: ${{ steps.vars.outputs.SERVICE_NAME }}
          IMAGE: ${{ steps.vars.outputs.IMAGE }}
          TAG: ${{ steps.vars.outputs.TAG }}
        run: |
          printf 'apiVersion: v2\nname: %s\ntype: application\nversion: "0"\n' "$SERVICE_NAME" > helm/Chart.yaml
          helm upgrade "$SERVICE_NAME" helm \
            --namespace "$NAMESPACE" \
            -f helm/prod.yaml \
            --set env=prod \
            --set image="$IMAGE" \
            --set imageTag="$TAG" \
            --install --wait --timeout 10m
